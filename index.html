<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8dbf5">
<title>The Rebranding colour palette</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --plum:#3b1659;--plum2:#6b3a8f;--muted:#7a5d93;--copper:#b0652f;--gold:#d9a95c;
    --bg1:#f3ebfa;--bg2:#dcc8f0;
    --taken-bg:#dcd5e4;--taken-ink:#9a92a6;--taken-line:#bfb4cc;--tile-bg:#fbf7f0;--tile-line:#e6d8c4;--tile-ink:#a8642f;
    --serif:"Italiana",Georgia,"Times New Roman",serif;--sans:"Jost",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  html{background:var(--bg2)}
  body{margin:0;min-height:100vh;color:var(--plum);font-family:var(--sans);
    background:radial-gradient(ellipse at 50% -10%,#fff 0,transparent 55%),linear-gradient(180deg,var(--bg1),var(--bg2));
    display:flex;justify-content:center;padding:calc(34px + env(safe-area-inset-top,0px)) 14px calc(48px + env(safe-area-inset-bottom,0px));position:relative;overflow-x:hidden}
  /* watercolour dots */
  .wc{position:fixed;border-radius:50%;pointer-events:none;z-index:0;filter:blur(1px)}
  .wc.a{width:190px;height:190px;left:-60px;top:12%;background:radial-gradient(circle,#c79bea99,#c79bea00 70%)}
  .wc.b{width:240px;height:240px;right:-80px;top:30%;background:radial-gradient(circle,#f08fc388,#f08fc300 70%)}
  .wc.c{width:300px;height:300px;left:-90px;bottom:-60px;background:radial-gradient(circle,#d055a277,#d055a200 70%)}
  .wc.d{width:260px;height:260px;right:-60px;bottom:-70px;background:radial-gradient(circle,#8d41bb77,#8d41bb00 70%)}
  .wc.e{width:26px;height:26px;right:12%;top:14%;background:#8d41bb;opacity:.55}
  .wc.f{width:14px;height:14px;left:10%;top:42%;background:#90be40;opacity:.7}
  .wc.g{width:18px;height:18px;right:7%;bottom:22%;background:#d055a2;opacity:.5}
  main{width:min(880px,100%);text-align:center;position:relative;z-index:1}
  .eyebrow{font-size:.74rem;letter-spacing:.42em;text-transform:uppercase;font-weight:600;margin:6px 0 14px;padding-left:.42em}
  h1{font-family:var(--serif);font-weight:400;font-size:clamp(2.4rem,8vw,4.6rem);line-height:1.02;margin:0;letter-spacing:-.01em}
  .sub{font-family:var(--serif);font-size:clamp(1.15rem,3.6vw,1.7rem);color:var(--plum2);margin:6px 0 0}
  .date{font-size:.74rem;letter-spacing:.42em;text-transform:uppercase;font-weight:600;margin:18px 0 0;padding-left:.42em}
  .orn{display:flex;align-items:center;justify-content:center;gap:12px;margin:20px auto 22px;color:var(--gold)}
  .orn::before,.orn::after{content:"";height:1px;width:64px;background:linear-gradient(90deg,transparent,var(--gold))}
  .orn::after{transform:scaleX(-1)}
  .orn i{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px #d9a95c33}
  .intro{max-width:520px;margin:0 auto 24px;color:var(--muted);line-height:1.6}
  .board-wrap{background:#ffffffa6;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid #fff;border-radius:22px;padding:clamp(10px,2.8vw,22px);box-shadow:0 24px 60px #5a2a8433,inset 0 0 0 1px #c9a8e633}
  .board{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:clamp(4px,1vw,8px)}
  .tile{appearance:none;border:1px solid var(--tile-line);border-radius:9px;aspect-ratio:1;background:var(--tile-bg);color:var(--tile-ink);overflow-wrap:anywhere;font:600 clamp(.58rem,1.8vw,.9rem)/1 var(--sans);cursor:pointer;box-shadow:0 2px 6px #5a2a8414,inset 0 1px 0 #fff;transition:transform .14s,box-shadow .14s,opacity .14s;touch-action:manipulation;padding:0}
  .tile:hover:not(:disabled),.tile:focus-visible{transform:translateY(-2px) scale(1.06);box-shadow:0 0 0 3px var(--copper),0 8px 16px #5a2a8433;outline:none;position:relative;z-index:1}
  .tile:disabled{cursor:default}
  .tile.sealed{opacity:.4}
  .tile.taken{background:var(--taken-bg);color:var(--taken-ink);border:1px dashed var(--taken-line);box-shadow:none;text-decoration:line-through;opacity:1}
  .tile.mine{opacity:1;background:var(--c);color:var(--t);border-color:#0002;box-shadow:0 0 0 3px var(--copper),0 10px 24px #5a2a8466;position:relative;z-index:1;transform:scale(1.1)}
  .status{min-height:24px;margin:17px 0 0;color:var(--muted);font-size:.9rem}
  .result{display:none;margin:18px auto 0;padding:16px 20px;max-width:420px;border:1px solid #d9c3ee;border-radius:16px;background:#fff;animation:rise .35s ease-out;align-items:center;gap:16px;text-align:left;box-shadow:0 10px 30px #5a2a8420}
  .result.show{display:flex}
  .chip{width:64px;height:64px;border-radius:50%;border:1px solid #0002;flex:none;box-shadow:0 4px 12px #0002}
  .result-label{font-size:.68rem;letter-spacing:.3em;text-transform:uppercase;color:var(--copper);font-weight:600}
  .cname{font-family:var(--serif);font-size:1.9rem;line-height:1.1;margin-top:3px}
  .chex{color:var(--muted);font-size:.85rem;margin-top:3px;font-variant-numeric:tabular-nums}
  .foot{font-size:.75rem;color:var(--muted);margin:16px 5px 0;line-height:1.45}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  @media(max-width:380px){.board{gap:3px}.tile{border-radius:6px}}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<i class="wc a"></i><i class="wc b"></i><i class="wc c"></i><i class="wc d"></i><i class="wc e"></i><i class="wc f"></i><i class="wc g"></i>
<main>
  <div class="eyebrow">You’re invited to</div>
  <h1>The Rebranding</h1>
  <div class="sub">colour palette</div>
  <div class="date">December, 2026</div>
  <div class="orn" aria-hidden="true"><i></i></div>
  <p class="intro">Pick one and your colour is revealed. It’s then locked in for you and greyed out so nobody else can take it.</p>
  <section class="board-wrap" aria-label="Choose one tile">
    <div class="board" id="board"></div>
    <div class="status" id="status" aria-live="polite">Tap one tile to reveal your colour.</div>
    <div class="result" id="result" role="status" aria-live="polite">
      <div class="chip" id="chip"></div>
      <div><div class="result-label">Your colour</div><div class="cname" id="cname"></div><div class="chex" id="chex"></div></div>
    </div>
  </section>
  <p class="foot" id="foot">One colour per person. Claimed tiles stay greyed out for everyone.</p>
</main>
<script>
(() => {
  // ====== PASTE YOUR SUPABASE DETAILS HERE ======
  const SUPABASE_URL = 'https://wvkuahmiixgqprlewevl.supabase.co';   // e.g. https://abcdxyz.supabase.co
  const SUPABASE_KEY = 'sb_publishable_O_bTj5FQJPgitrAAOg5tcg_aNyHjHvd';
  // ===============================================

  const online = /^https:\/\/.+\.supabase\.co/.test(SUPABASE_URL) && SUPABASE_KEY.length > 20;
  const API = SUPABASE_URL.replace(/\/$/, '') + '/rest/v1/claims';
  const H = { apikey: SUPABASE_KEY };
  if (SUPABASE_KEY.startsWith('eyJ')) H.Authorization = 'Bearer ' + SUPABASE_KEY;

  const COLORS = {
    purple:{name:'Purple',hex:'#8d41bb',ink:'#ffffff'},
    pink:{name:'Pink',hex:'#d055a2',ink:'#ffffff'},
    white:{name:'White',hex:'#ffffff',ink:'#1d2433'},
    lemon:{name:'Lemon',hex:'#90be40',ink:'#1d2a08'}
  };
  const LEMON = new Set([19,31,49,63,82]);
  function colorOf(n){
    if (LEMON.has(n)) return 'lemon';
    const p = (n - 1) % 20 + 1;
    return p <= 13 ? 'purple' : p <= 17 ? 'pink' : 'white';
  }
  const N = 100;
  const $ = id => document.getElementById(id);
  const board = $('board'), status = $('status'), result = $('result');
  const pad = n => String(n).padStart(2,'0');

  const store = {
    get(k){ try { return localStorage.getItem(k); } catch { return null; } },
    set(k,v){ try { localStorage.setItem(k,v); } catch {} }
  };
  let clientId = store.get('palette-client-id');
  if (!clientId) {
    clientId = (crypto.randomUUID ? crypto.randomUUID() : 'c' + Math.random().toString(36).slice(2) + Date.now().toString(36));
    store.set('palette-client-id', clientId);
  }

  let taken = new Set();
  let mine = parseInt(store.get('palette-my-pick'), 10);
  if (!(mine >= 1 && mine <= N)) mine = null;
  let busy = false;

  const tiles = [];
  for (let n = 1; n <= N; n++) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'tile';
    b.addEventListener('click', () => claim(n));
    board.appendChild(b);
    tiles.push(b);
  }

  function render(){
    tiles.forEach((b, i) => {
      const n = i + 1, c = COLORS[colorOf(n)];
      const isMine = mine === n;
      const isTaken = !isMine && taken.has(n);
      b.classList.toggle('mine', isMine);
      b.classList.toggle('taken', isTaken);
      b.classList.toggle('sealed', !isMine && !isTaken && mine !== null);
      b.disabled = isTaken || isMine || mine !== null || busy;
      if (isMine) { b.style.setProperty('--c', c.hex); b.style.setProperty('--t', c.ink); b.textContent = c.name; }
      else { b.style.removeProperty('--c'); b.style.removeProperty('--t'); b.textContent = pad(n); }
      b.setAttribute('aria-label', isMine ? `Tile ${pad(n)}, ${c.name}, yours` : isTaken ? `Tile ${pad(n)}, already taken` : `Tile ${pad(n)}`);
    });
    if (mine !== null) {
      const c = COLORS[colorOf(mine)];
      $('chip').style.background = c.hex;
      $('cname').textContent = c.name;
      $('chex').textContent = `${c.hex.toUpperCase()} · tile ${pad(mine)}`;
      result.classList.add('show');
      status.textContent = 'Your colour is locked in.';
    } else {
      result.classList.remove('show');
      status.textContent = taken.size ? `${taken.size} of ${N} tiles already claimed. Tap one to claim yours.` : 'Tap one tile to claim your colour.';
    }
  }

  async function refresh(){
    if (!online) return;
    try {
      const r = await fetch(API + '?select=tile', { headers: H });
      if (!r.ok) throw new Error(r.status);
      const rows = await r.json();
      taken = new Set(rows.map(x => x.tile));
    } catch (e) { /* keep last known state */ }
  }

  async function recoverMine(){
    if (!online) return;
    try {
      const r = await fetch(API + '?select=tile&client_id=eq.' + encodeURIComponent(clientId), { headers: H });
      if (!r.ok) return;
      const rows = await r.json();
      if (rows.length) { mine = rows[0].tile; store.set('palette-my-pick', String(mine)); }
    } catch (e) {}
  }

  async function claim(n){
    if (mine !== null || busy || taken.has(n)) return;
    busy = true; render();
    try {
      if (online) {
        const r = await fetch(API, {
          method: 'POST',
          headers: { ...H, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
          body: JSON.stringify({ tile: n, client_id: clientId })
        });
        if (r.status === 409) {
          await recoverMine();               // already picked something earlier?
          if (mine === null) { taken.add(n); status.textContent = 'Someone just took that one. Try another.'; }
        } else if (!r.ok) {
          throw new Error(r.status);
        } else {
          mine = n; taken.add(n);
        }
      } else {
        mine = n;
      }
      if (mine !== null) store.set('palette-my-pick', String(mine));
    } catch (e) {
      status.textContent = 'Couldn’t save that pick. Please try again.';
    } finally {
      busy = false;
      const msg = status.textContent;
      render();
      if (mine === null && /took|taken|Couldn/.test(msg)) status.textContent = msg;
    }
  }

  if (!online) $('foot').textContent = 'Setup needed: add your Supabase details at the top of the script. Until then, picks are saved only on this device.';

  render();
  (async () => {
    await Promise.all([refresh(), recoverMine()]);
    render();
    setInterval(async () => {
      if (document.hidden || busy) return;
      await refresh(); render();
    }, 4000);
  })();
})();
</script>
</body>
</html>
